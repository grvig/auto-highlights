# Copy this file to config.toml and fill in your own values.
# config.toml is git-ignored — never commit real passwords.

[paths]
# Root of the CS2 install (the folder containing game/bin/win64/cs2.exe).
# Optional: leave it out and the install is found through Steam automatically.
# Set it only if detection picks the wrong library.
# cs2_root = "D:/SteamLibrary/steamapps/common/Counter-Strike Global Offensive"

# Where finished reels are written.
output_dir = "./output"

# Where raw per-moment clips land before stitching.
clips_dir = "./clips"

# Cache of parsed demos, so reopening a demo is instant. Optional: defaults to
# a "cache" folder next to clips_dir. Keep it on a drive with free space.
# cache_dir = "./cache"

# ffmpeg executable, used to stitch clips into the final reel. Leave as
# "ffmpeg" if it is on PATH, or give the full path to ffmpeg.exe.
ffmpeg = "ffmpeg"

# HLAE install folder (the one holding HLAE.exe). Optional: the copy that
# ships with the app is used when this is left out.
# hlae = "D:/auto-highlights/tools/hlae"

[recording]
# "hlae" renders every frame with synced game audio (recommended).
# "window" captures the game window in real time, a fallback without HLAE.
recorder = "hlae"
# Fetch the newest HLAE from its official GitHub releases before recording.
# CS2 updates break older HLAE builds, so leave this on.
auto_update = true
# Render size. 1440x1080 is 4:3; reels are stretched to 16:9 on export.
width = 1440
height = 1080
framerate = 60
# Reel shape: "stretched" (4:3 stretched to 16:9), "4:3", "pillarbox",
# "16:9" or "vertical".
aspect = "stretched"
# "clean" hides everything except the kill feed and crosshair. "full" keeps
# a HUD, but demos only offer CS2's spectator HUD (team bar with money and
# avatars), not the one you see in-game.
hud = "clean"
# Window capture only: the sound device that hears the game, e.g. a loopback
# such as "virtual-audio-capturer". Leave out to record without sound.
# audio_device = "virtual-audio-capturer"

[clips]
# Seconds kept before the action and after the last kill. A firefight that
# was already going is followed further back, and quiet stretches are cut.
pre_roll_seconds = 3.0
post_roll_seconds = 2.0
# Kills closer together than this stay in one continuous clip.
merge_gap_seconds = 10.0

[editing]
# Your usual style, so it needs no flags each run. Flags still win.
# music = "D:/music/track.mp3"
# music_start = 0.0
# "cut" (plain hard cuts), "fade", "fadeblack", "fadewhite", "smoothleft" or "zoomin".
transition = "cut"
# Slow motion, punch-ins on headshots and flashes on kills.
pro = false
# Seconds of your best plays a recorded reel aims for (0 = every play).
target_seconds = 120
