# Copy this file to config.toml and fill in your own values.
# config.toml is git-ignored — never commit real passwords.

[paths]
# Root of the CS2 install (the folder containing game/bin/win64/cs2.exe).
# Optional: leave it out and the install is found through Steam automatically.
# Set it only if detection picks the wrong library.
# cs2_root = "D:/SteamLibrary/steamapps/common/Counter-Strike Global Offensive"

# Where finished reels are written.
output_dir = "./output"

# Where raw per-moment clips land before stitching.
clips_dir = "./clips"

# Cache of parsed demos, so reopening a demo is instant. Optional: defaults to
# a "cache" folder next to clips_dir. Keep it on a drive with free space.
# cache_dir = "./cache"

# ffmpeg executable, used to stitch clips into the final reel. Leave as
# "ffmpeg" if it is on PATH, or give the full path to ffmpeg.exe.
ffmpeg = "ffmpeg"

[obs]
host = "localhost"
port = 4455
# From OBS: Tools -> WebSocket Server Settings -> Show Connect Info.
password = "your-obs-websocket-password"

[clips]
# Seconds of footage kept either side of a highlight moment.
pre_roll_seconds = 3.0
post_roll_seconds = 2.0
