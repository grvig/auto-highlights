[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-highlights"
version = "0.1.0"
description = "Turn a Counter-Strike 2 demo into a highlight reel for one player"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "awpy>=2.0.0",
    "demoparser2>=0.42.2",
    "polars>=1.0.0",
    "numpy>=1.26",
    "pywebview>=6.0",
    "zstandard>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pyflakes>=3.0"]

[project.scripts]
highlights = "highlights.cli:main"

[tool.setuptools.packages.find]
include = ["highlights*"]

[tool.setuptools.package-data]
highlights = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
