name: release

# Push a tag like v0.2.0 to build the installer and publish it as a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies and build tools
        run: |
          pip install -r requirements.txt pyinstaller
          choco install innosetup -y --no-progress
      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(python -c "import highlights; print(highlights.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
      - name: Build the interface, the app and its installer
        run: python packaging/build.py --out build --installer
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # this version's section of CHANGELOG.md, without its heading
          awk -v v="## $version " 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "${GITHUB_REF_NAME}" build/installer/*-setup.exe \
            --title "auto-highlights $version" --notes-file notes.md
